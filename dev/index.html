<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>i95 · Dev sandbox</title>
    <script>
      // Always use /dev/ (with the slash) so relative asset paths resolve on any host.
      if (!location.pathname.endsWith('/')) location.replace(location.pathname + '/' + location.search + location.hash);
    </script>
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f4f6f9; --panel: #ffffff; --line: #dde3ea; --ink: #1d2430; --muted: #6b7685;
        --accent: #2f6fde; --accent-soft: #e6eefc; --danger: #c0392b; --warn: #a8710b; --ok: #1e8449;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: var(--ink);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
      #app { display: grid; grid-template-columns: 250px 1fr 330px; grid-template-rows: auto 1fr; height: 100%; }
      #toolbar { grid-column: 1 / 4; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
      #toolbar .brand { font-weight: 700; margin-right: 6px; }
      #toolbar .group { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-left: 1px solid var(--line); }
      #toolbar .group:first-of-type { border-left: 0; }
      #toolbar label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
      #sidebar { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 8px; }
      #sidebar input[type=search] { width: 100%; margin-bottom: 8px; }
      details { margin-bottom: 4px; }
      summary { cursor: pointer; font-weight: 600; padding: 4px 6px; border-radius: 6px; list-style: none; display: flex; justify-content: space-between; }
      summary::-webkit-details-marker { display: none; }
      summary::before { content: "▸"; margin-right: 6px; color: var(--muted); transition: transform .15s; }
      details[open] > summary::before { transform: rotate(90deg); }
      summary .count { color: var(--muted); font-weight: 400; margin-left: auto; }
      .item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px 5px 24px; border-radius: 6px; cursor: pointer; color: var(--ink); font: inherit; }
      .item:hover { background: #f0f3f7; }
      .item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
      #stage { position: relative; overflow: hidden; background: #eef2f6; }
      #stage canvas { display: block; }
      #hud { position: absolute; left: 10px; bottom: 10px; background: rgba(29,36,48,.75); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; pointer-events: none; }
      #inspector { background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 12px 14px; }
      #inspector h2 { margin: 0 0 2px; font-size: 16px; }
      #inspector .cat { color: var(--muted); margin-bottom: 10px; }
      #inspector h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
      .idrow { display: flex; gap: 4px; margin-bottom: 6px; }
      .idrow textarea { flex: 1; resize: none; overflow: hidden; word-break: break-all; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: #f8fafc; min-width: 0; }
      .idlabel { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
      .field { display: grid; grid-template-columns: 110px 1fr auto; align-items: center; gap: 6px; margin: 5px 0; }
      .field.check { grid-template-columns: auto 1fr; }
      .field .val { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
      .multi { display: flex; flex-direction: column; gap: 2px; }
      .actions { display: flex; flex-wrap: wrap; gap: 6px; }
      .parts { display: flex; flex-direction: column; max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px; }
      .part { border: 0; background: none; text-align: left; padding: 3px 8px; border-radius: 5px; font: 12px ui-monospace, Menlo, monospace; }
      .part:hover { background: #fdeefd; }
      .part.active { background: #ff00ff; color: #fff; }
      button, select, input[type=search], input[type=text] { font: inherit; }
      button { padding: 4px 10px; border-radius: 6px; border: 1px solid #c8d0db; background: #f7f9fb; cursor: pointer; color: var(--ink); }
      button:hover { background: #eef2f6; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
      select, input[type=search], input[type=text] { padding: 4px 6px; border: 1px solid #c8d0db; border-radius: 6px; background: #fff; }
      input[type=range] { width: 100%; }
      pre.info { white-space: pre-wrap; font: 11px/1.45 ui-monospace, Menlo, monospace; background: #f6f8fa; padding: 8px; border-radius: 6px; margin: 0; }
      .toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: #fff; padding: 6px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
      .toast.show { opacity: .92; }
      .help { color: var(--muted); font-size: 12px; }
      @media (max-width: 1000px) { #app { grid-template-columns: 200px 1fr 280px; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="sidebar"></div>
      <div id="stage"><div id="hud"></div></div>
      <div id="inspector"></div>
    </div>
    <div class="toast" id="toast"></div>
    <script type="module" src="../src/dev/main.ts"></script>
  </body>
</html>
